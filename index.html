<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Randomizer - Style Rift</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-color: #0b0f19;
      --text-color: #38bdf8;
      --btn-bg: #1e293b;
      --btn-border: #334155;
      --btn-text: #e2e8f0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filters button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filters button.active {
      background: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
      font-weight: 700;
    }
    .double-toggle button {
      background: transparent;
      color: var(--text-color);
      border: 1px dashed var(--btn-border);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      opacity: 0.6;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .double-toggle button.active {
      opacity: 1;
      border-style: solid;
      font-weight: 600;
      background: var(--btn-bg);
    }
    #display-box {
      font-size: 2.3rem;
      font-weight: 700;
      padding: 20px;
      max-width: 85%;
      line-height: 1.3;
    }
    .sub-text {
      font-size: 0.9rem;
      opacity: 0.5;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="controls-container" onclick="event.stopPropagation()">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Style Rift</button>
      <button class="filter-btn" data-filter="fortnite">Fortnite</button>
      <button class="filter-btn" data-filter="smash">Smash Bros</button>
    </div>

    <div class="double-toggle">
      <button id="double-btn" onclick="toggleDouble()">Make it a double!</button>
    </div>
  </div>

  <div id="display-box">Tap anywhere to randomize</div>
  <div class="sub-text">Tap anywhere or press Space to randomize</div>

  <script>
    let themes = [
      { term: "Cyberpunk Neon", category: "sci-fi", keywords: "stylerift" },
      { term: "Medieval Castle", category: "fantasy", keywords: "fortnite" },
      { term: "Final Destination", category: "gaming", keywords: "smash bros" }
    ];
    let currentFilter = 'all';
    let isDouble = false;

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzY7xb-xILlwOw7IKtE_TCyYoF3u-Cnu04JgrJY5SDFU9faPN_7CAIv2vs1Yrg_TjqG/exec';

    async function init() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        if (data && data.length > 0) themes = data;
      } catch (err) {
        console.error(err);
      }
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
      });
    });

    function toggleDouble() {
      isDouble = !isDouble;
      document.getElementById('double-btn').classList.toggle('active', isDouble);
    }

    function triggerRandomizer() {
      if (themes.length === 0) return;

      const hue = Math.floor(Math.random() * 360);
      document.documentElement.style.setProperty('--bg-color', `hsl(${hue}, 75%, 9%)`);
      document.documentElement.style.setProperty('--text-color', `hsl(${hue}, 90%, 82%)`);
      document.documentElement.style.setProperty('--btn-bg', `hsl(${hue}, 60%, 18%)`);
      document.documentElement.style.setProperty('--btn-border', `hsl(${hue}, 50%, 32%)`);
      document.documentElement.style.setProperty('--btn-text', `#ffffff`);

      let pool = currentFilter === 'all' 
        ? themes 
        : themes.filter(t => t.keywords && t.keywords.toLowerCase().includes(currentFilter));

      const displayBox = document.getElementById('display-box');

      if (pool.length === 0) {
        displayBox.innerText = "No themes found for this filter";
        return;
      }

      if (isDouble) {
        let t1 = pool[Math.floor(Math.random() * pool.length)];
        let t2 = t1;
        let attempts = 0;
        while (t2.category === t1.category && attempts < 100) {
          t2 = pool[Math.floor(Math.random() * pool.length)];
          attempts++;
        }
        displayBox.innerHTML = t2.category !== t1.category 
          ? `${t1.term} <span style="opacity:0.4; font-size:1.4rem;"><br>+<br></span> ${t2.term}`
          : `${t1.term}`;
      } else {
        displayBox.innerText = pool[Math.floor(Math.random() * pool.length)].term;
      }
    }

    window.addEventListener('click', triggerRandomizer);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        triggerRandomizer();
      }
    });

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
