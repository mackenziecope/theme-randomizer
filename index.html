<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Randomizer - Style Rift</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-color: #0b0f19;
      --text-color: #38bdf8;
      --btn-bg: #1e293b;
      --btn-border: #334155;
      --btn-text: #e2e8f0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filters button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filters button.active {
      background: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
      font-weight: 700;
    }
    .double-toggle button {
      background: transparent;
      color: var(--text-color);
      border: 1px dashed var(--btn-border);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      opacity: 0.6;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .double-toggle button.active {
      opacity: 1;
      border-style: solid;
      font-weight: 600;
      background: var(--btn-bg);
    }
    #display-box {
      font-size: 2.3rem;
      font-weight: 700;
      padding: 20px;
      max-width: 85%;
      line-height: 1.3;
    }
    .sub-text {
      font-size: 0.9rem;
      opacity: 0.5;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="controls-container" onclick="event.stopPropagation()">
    <div class="filters">
      <button class="filter-btn active" data-filter="stylerift">Style Rift</button>
      <button class="filter-btn" data-filter="fortnite">Fortnite</button>
      <button class="filter-btn" data-filter="smash bros">Smash Bros</button>
    </div>

    <div class="double-toggle">
      <button id="double-btn" onclick="toggleDouble()">Make it a double!</button>
    </div>
  </div>

  <div id="display-box">Loading themes...</div>
  <div class="sub-text">Tap anywhere or press Space to randomize</div>

  <script>
    let themes = [];
    let currentFilter = 'stylerift';
    let isDouble = false;

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzY7xb-xILlwOw7IKtE_TCyYoF3u-Cnu04JgrJY5SDFU9faPN_7CAIv2vs1Yrg_TjqG/exec';

    async function init() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        themes = await response.json();
        
        if (themes.length === 0) {
          document.getElementById('display-box').innerText = "Sheet is empty or check headers.";
        } else {
          document.getElementById('display-box').innerText = "Tap anywhere to randomize";
        }
      } catch (err) {
        document.getElementById('display-box').innerText = "Error loading themes.";
        console.error(err);
      }
    }

    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
      });
    });

    function toggleDouble() {
      isDouble = !isDouble;
      const doubleBtn = document.getElementById('double-btn');
      if (isDouble) {
        doubleBtn.classList.add('active');
      } else {
        doubleBtn.classList.remove('active');
      }
    }
