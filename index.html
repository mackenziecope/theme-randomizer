<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Randomizer - Style Rift</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      --bg-color: #0b0f19;
      --text-color: #38bdf8;
      --btn-bg: #1e293b;
      --btn-border: #334155;
      --btn-text: #e2e8f0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 25px;
      max-width: 90%;
    }
    .graphic-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 4px;
    }
    #graphic-display {
      max-width: 220px;
      max-height: 220px;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .app-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 0;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .mix-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px dashed var(--btn-border);
      width: 100%;
      box-sizing: border-box;
    }
    .mix-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
      font-weight: 700;
    }
    .filter-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
      font-weight: 700;
    }
    .double-toggle button {
      background: transparent;
      color: var(--text-color);
      border: 1px dashed var(--btn-border);
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 0.8rem;
      opacity: 0.7;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .double-toggle button.active {
      opacity: 1;
      border-style: solid;
      font-weight: 600;
      background: var(--btn-bg);
    }
    #display-box {
      font-size: 2.3rem;
      font-weight: 700;
      padding: 20px;
      max-width: 85%;
      line-height: 1.3;
    }
    .sub-text {
      font-size: 0.9rem;
      opacity: 0.5;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="controls-container" onclick="event.stopPropagation()">
    <div class="graphic-container">
      <img id="graphic-display" src="shirt1.png" alt="Style Rift Graphic">
    </div>
    <h1 class="app-title">Style Rift</h1>

    <div class="mix-section">
      <span class="mix-header">Mix it up!</span>
      <div class="filters">
        <button class="filter-btn" data-filter="fortnite">Fortnite</button>
        <button class="filter-btn" data-filter="smash">Smash Bros</button>
        <button class="filter-btn" data-filter="silly">With a twist!</button>
      </div>
    </div>

    <div class="double-toggle">
      <button id="double-btn" onclick="toggleDouble()">Make it a double!</button>
    </div>
  </div>

  <div id="display-box">Loading themes...</div>
  <div class="sub-text">Tap anywhere to randomize</div>

  <script>
    let themes = [];
    let activeAddOns = { fortnite: false, smash: false, silly: false };
    let isDouble = false;

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzY7xb-xILlwOw7IKtE_TCyYoF3u-Cnu04JgrJY5SDFU9faPN_7CAIv2vs1Yrg_TjqG/exec';

    async function init() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        if (data && data.length > 0) {
          themes = data;
          document.getElementById('display-box').innerText = "Tap anywhere to randomize";
        }
      } catch (err) {
        document.getElementById('display-box').innerText = "Error loading themes.";
        console.error(err);
      }
    }

    const filterButtons = document.querySelectorAll('.mix-section .filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        btn.classList.toggle('active');
        const filterKey = btn.getAttribute('data-filter');
        activeAddOns[filterKey] = btn.classList.contains('active');
      });
    });

    function toggleDouble() {
      isDouble = !isDouble;
      const doubleBtn = document.getElementById('double-btn');
      if (isDouble) {
        doubleBtn.classList.add('active');
      } else {
        doubleBtn.classList.remove('active');
      }
    }

    function applyRandomAlgorithmicTheme() {
      const hue = Math.floor(Math.random() * 360);
      const root = document.documentElement;
      root.style.setProperty('--bg-color', `hsl(${hue}, 75%, 9%)`);
      root.style.setProperty('--text-color', `hsl(${hue}, 90%, 82%)`);
      root.style.setProperty('--btn-bg', `hsl(${hue}, 60%, 18%)`);
      root.style.setProperty('--btn-border', `hsl(${hue}, 50%, 32%)`);
      root.style.setProperty('--btn-text', '#ffffff');
    }

function rollGraphic() {
      const roll = Math.random() * 100;
      let file = 'shirt1.png';
      if (roll < 1) {
        file = 'shirt7.gif';
      } else if (roll < 6) {
        file = 'shirt6.gif';
      } else if (roll < 20) {
        file = 'shirt5.png';
      } else if (roll < 40) {
        file = 'shirt4.png';
      } else if (roll < 60) {
        file = 'shirt3.png';
      } else if (roll < 80) {
        file = 'shirt2.png';
      } else {
        file = 'shirt1.png';
      }
      document.getElementById('graphic-display').src = file;
    }
    
      function triggerRandomizer() {
      if (themes.length === 0) return;

      rollGraphic();
      applyRandomAlgorithmicTheme();

      const displayBox = document.getElementById('display-box');

      const basePool = themes.filter(t => !t.keywords || t.keywords.trim() === '');
      let pool = [...basePool];

      Object.keys(activeAddOns).forEach(key => {
        if (activeAddOns[key]) {
          const addOnPool = themes.filter(t => t.keywords && t.keywords.toLowerCase().includes(key));
          pool = [...pool, ...addOnPool];
        }
      });

      if (pool.length === 0) {
        displayBox.innerText = "No themes found for this selection";
        return;
      }

      if (isDouble) {
        let theme1 = pool[Math.floor(Math.random() * pool.length)];
        let theme2 = null;
        let attempts = 0;

        do {
          let candidate = pool[Math.floor(Math.random() * pool.length)];
          if (candidate.category !== theme1.category) {
            theme2 = candidate;
            break;
          }
          attempts++;
        } while (attempts < 100);

        if (theme2) {
          displayBox.innerHTML = `${theme1.term} <span style="opacity:0.4; font-size:1.4rem;"><br>+<br></span> ${theme2.term}`;
        } else {
          displayBox.innerText = `${theme1.term} (No distinct category match found)`;
        }
      } else {
        let selected = pool[Math.floor(Math.random() * pool.length)];
        displayBox.innerText = selected.term;
      }
    }

    window.addEventListener('touchend', triggerRandomizer);
    window.addEventListener('click', triggerRandomizer);

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
