<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Randomizer - Style Rift</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-color: #0b0f19;
      --text-color: #38bdf8;
      --btn-bg: #1e293b;
      --btn-border: #334155;
      --btn-text: #e2e8f0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
      cursor: pointer;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filters button {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filters button.active {
      background: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
      font-weight: 700;
    }
    /* Smaller, de-emphasized double option style */
    .double-toggle button {
      background: transparent;
      color: var(--text-color);
      border: 1px dashed var(--btn-border);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      opacity: 0.6;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .double-toggle button.active {
      opacity: 1;
      border-style: solid;
      font-weight: 600;
      background: var(--btn-bg);
    }
    #display-box {
      font-size: 2.3rem;
      font-weight: 700;
      padding: 20px;
      max-width: 85%;
      line-height: 1.3;
    }
    .sub-text {
      font-size: 0.9rem;
      opacity: 0.5;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="controls-container" onclick="event.stopPropagation()">
    <!-- Keyword Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Style Rift</button>
      <button class="filter-btn" data-filter="fortnite">Fortnite</button>
      <button class="filter-btn" data-filter="smash bros">Smash Bros</button>
    </div>

    <!-- Smaller Double Toggle Option -->
    <div class="double-toggle">
      <button id="double-btn" onclick="toggleDouble()">Make it a double!</button>
    </div>
  </div>

  <!-- Randomizer Display Area -->
  <div id="display-box">Loading themes...</div>
  <div class="sub-text">Tap anywhere or press Space to randomize</div>

  <script>
    let themes = [];
    let currentFilter = 'all';
    let isDouble = false;

    const SHEET_ID = '2PACX-1vQQHy9orIk-gAE8p_nh5LOA4vuEYe9k-PZd0d9iMHN3DyMWTPM3jvsolEDazxc7-vcplKLDABsERRHd';
    const SHEET_JSON_URL = `https://opensheet.elk.sh/${SHEET_ID}/1`;

    async function init() {
      try {
        const response = await fetch(SHEET_JSON_URL);
        const data = await response.json();
        
        themes = data.map(row => {
          let cleanRow = {};
          for (let key in row) {
            cleanRow[key.trim().toLowerCase()] = row[key] ? String(row[key]).trim() : '';
          }
          return cleanRow;
        });

        if (themes.length === 0) {
          document.getElementById('display-box').innerText = "Sheet is empty.";
        } else {
          document.getElementById('display-box').innerText = "Tap anywhere to randomize";
        }
      } catch (err) {
        document.getElementById('display-box').innerText = "Error loading themes.";
        console.error(err);
      }
    }

    // Filter button handling
    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
      });
    });

    // Toggle Double Mode
    function toggleDouble() {
      isDouble = !isDouble;
      const doubleBtn = document.getElementById('double-btn');
      if (isDouble) {
        doubleBtn.classList.add('active');
      } else {
        doubleBtn.classList.remove('active');
      }
    }

    // Algorithmic random vivid color generator guaranteeing 4.5:1+ contrast ratio
    function applyRandomAlgorithmicTheme() {
      const hue = Math.floor(Math.random() * 360);
      const bg = `hsl(${hue}, 75%, 9%)`;
      const text = `hsl(${hue}, 90%, 82%)`;
      
      const root = document.documentElement;
      root.style.setProperty('--bg-color', bg);
      root.style.setProperty('--text-color', text);
      root.style.setProperty('--btn-bg', `hsl(${hue}, 60%, 18%)`);
      root.style.setProperty('--btn-border', `hsl(${hue}, 50%, 32%)`);
      root.style.setProperty('--btn-text', `#ffffff`);
    }

    // Randomization Logic
    function triggerRandomizer() {
      if (themes.length === 0) return;

      applyRandomAlgorithmicTheme();

      const displayBox = document.getElementById('display-box');

      // Filter pool based on selected keyword category
      let pool = themes;
      if (currentFilter !== 'all') {
        pool = themes.filter(t => t.keywords && t.keywords.toLowerCase().includes(currentFilter));
      }

      if (pool.length === 0) {
        displayBox.innerText = `No themes found for this filter`;
        return;
      }

      if (isDouble) {
        let theme1 = pool[Math.floor(Math.random() * pool.length)];
        let theme2 = null;
        let attempts = 0;

        do {
          let candidate = pool[Math.floor(Math.random() * pool.length)];
          if (candidate.category !== theme1.category) {
            theme2 = candidate;
            break;
          }
          attempts++;
        } while (attempts < 100);

        if (theme2) {
          displayBox.innerHTML = `${theme1.term} <span style="opacity:0.4; font-size:1.4rem;"><br>+<br></span> ${theme2.term}`;
        } else {
          displayBox.innerText = `${theme1.term} (No distinct category match found)`;
        }

      } else {
        let selected = pool[Math.floor(Math.random() * pool.length)];
        displayBox.innerText = selected.term;
      }
    }

    // Tap or Spacebar triggers randomizer
    window.addEventListener('click', triggerRandomizer);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        triggerRandomizer();
      }
    });

    // Start app
    init();

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered!', reg))
          .catch((err) => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
